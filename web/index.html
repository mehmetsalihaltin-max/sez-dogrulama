<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEZ</title>
<meta name="description" content="Shows the operations team which event is backed by which evidence, along the route.">
<style>
@font-face{font-family:Switzer;src:url(/font/switzer-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Switzer;src:url(/font/switzer-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Switzer;src:url(/font/switzer-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Clash;src:url(/font/clash-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Clash;src:url(/font/clash-600.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  --murekkep:#152a38;--koyu:#0d1b24;--soluk:#5a6b76;--zemin:#fbfbf9;--yuzey:#fff;--yuzey2:#f4f4f1;--cizgi:#e3e5e3;
  --sinyal:#a3362f;--sinyal-z:#f5e6e4;--orta:#7d5410;--orta-z:#f5ecd9;--onay:#2f6b4f;
  --deniz:#dfe6ea;--kara:#fff;--kiyi:#b9c4ca;--gecilen:#f1ece2;
  --golge:0 1px 2px rgb(21 42 56 / .05);--golge2:0 2px 4px rgb(21 42 56 / .06),0 8px 24px rgb(21 42 56 / .06);
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;--s8:64px;
  --baslik:Clash,Switzer,system-ui,sans-serif;--govde:Switzer,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font:400 16px/1.5 var(--govde);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent 0 63px,rgb(21 42 56 / .022) 63px 64px),repeating-linear-gradient(90deg,transparent 0 63px,rgb(21 42 56 / .022) 63px 64px)}
h1,h2,p,ol{margin:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--murekkep);outline-offset:2px}
.ekran{position:relative;display:grid;grid-template-columns:minmax(0,11fr) minmax(400px,9fr);grid-template-rows:auto minmax(0,1fr);gap:var(--s2);height:100vh;padding:0 var(--s2) var(--s2)}
.ust{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s4);align-items:center;margin:0 calc(var(--s2) * -1);padding:var(--s2) var(--s3);background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.damga{display:flex;align-items:baseline;gap:var(--s2);font:600 32px/1 var(--baslik);letter-spacing:.01em;color:var(--koyu)}
form{display:flex;gap:var(--s1);align-items:center}
.kutu{flex:1;min-width:0;position:relative}
.oneri{position:absolute;z-index:20;top:100%;left:0;min-width:360px;max-height:320px;overflow:auto;margin:4px 0 0;padding:4px 0;list-style:none;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:4px;box-shadow:var(--golge2)}
.oneri:empty{display:none}
.oneri li{padding:var(--s1) var(--s2);font-size:14px;line-height:1.4;cursor:pointer}
.oneri li:hover,.oneri li[aria-selected=true]{background:var(--yuzey2)}
.kutu[hidden]{display:none}
.mod{display:flex;border:1px solid var(--cizgi);border-radius:4px;overflow:hidden;flex:none}
.mod button{height:46px;border:0;border-radius:0;background:none;color:var(--soluk);padding:0 var(--s2)}
.mod button:hover{background:var(--yuzey2);box-shadow:none;transform:none}
.mod button[aria-pressed=true]{background:var(--yuzey2);color:var(--murekkep)}
.kutu.tarih{flex:0 0 160px}
.kutu input[type=date]{padding:0 var(--s1);color:var(--soluk)}
label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
input{width:100%;height:48px;border:1px solid var(--cizgi);border-radius:4px;background:var(--yuzey);color:inherit;font:400 16px/1.3 var(--govde);padding:0 var(--s2);transition:border-color .12s}
input:hover{border-color:var(--kiyi)}
input:focus{outline:0;border-color:var(--murekkep)}
button{height:48px;font:600 13px/1 var(--baslik);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--murekkep);border-radius:4px;background:var(--murekkep);color:#fff;padding:0 var(--s3);cursor:pointer;transition:background .12s,color .12s,box-shadow .12s,transform .12s}
button:hover{background:var(--koyu);box-shadow:var(--golge2);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:progress;transform:none}
.sahne-ac{background:none;color:var(--murekkep);white-space:nowrap}
.sahne-ac:hover{background:var(--yuzey2)}
.ses{display:inline-flex;align-items:center;gap:var(--s1);background:none;color:var(--murekkep);white-space:nowrap;padding:0 var(--s2)}
.ses:hover{background:var(--yuzey2)}
.ses svg{width:18px;height:18px;flex:none}
.ses[aria-pressed=true]{background:var(--sinyal);border-color:var(--sinyal);color:#fff}
.ses[aria-pressed=true] svg{animation:nabiz 1s ease-in-out infinite}
@keyframes nabiz{50%{opacity:.35}}
.duyulan{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:20;max-width:min(880px,90vw);background:var(--koyu);color:#fff;border-radius:6px;padding:14px 20px;box-shadow:var(--golge2);font:400 18px/1.4 var(--govde)}
.duyulan small{display:block;margin-top:6px;color:var(--kiyi);font:600 11px/1 var(--govde);letter-spacing:.08em;text-transform:uppercase}
.dil{display:flex;border:1px solid var(--cizgi);border-radius:4px;overflow:hidden}
.dil button{height:46px;border:0;border-radius:0;background:none;color:var(--soluk);padding:0 var(--s2)}
.dil button:hover{background:var(--yuzey2);box-shadow:none;transform:none}
.dil button[aria-pressed=true]{background:var(--murekkep);color:#fff}
.harita{position:relative;background:var(--deniz);border:1px solid var(--cizgi);border-radius:6px;box-shadow:var(--golge2);min-height:0;overflow:hidden}
svg{display:block;width:100%;height:100%}
.ag{fill:none;stroke:var(--kiyi);stroke-width:.5;stroke-dasharray:2 4;opacity:.7}
.kure{fill:var(--deniz);stroke:var(--kiyi);stroke-width:1}
.kara{fill:var(--kara);stroke:var(--kiyi);stroke-width:.5}
.gecilen{fill:var(--gecilen)}
.kapali{fill:none;stroke:var(--sinyal);stroke-width:5;stroke-dasharray:8 6}
.koridor{fill:none;stroke:var(--murekkep);stroke-opacity:.08;stroke-linecap:round}
.yol{fill:none;stroke:var(--murekkep);stroke-width:2.5;stroke-linecap:round}
.ciz{animation:ciz 1.2s ease-out both}
@keyframes ciz{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.uc{fill:var(--yuzey);stroke:var(--murekkep);stroke-width:2}
.ucad{font:600 16px var(--baslik);fill:var(--koyu);paint-order:stroke;stroke:var(--deniz);stroke-width:4px}
.olcek{stroke:var(--murekkep);stroke-width:2;fill:none}
.olcekad{font:500 12px var(--govde);fill:var(--murekkep);text-anchor:middle}
.imi{cursor:pointer}
.imi circle{stroke:var(--yuzey);stroke-width:2;transition:r .12s}
.imi text{font:600 12px var(--govde);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.imi text.imad{font:500 14px var(--govde);fill:var(--murekkep);paint-order:stroke;stroke:var(--deniz);stroke-width:4px}
.imi .dokun{fill:transparent;stroke:none;r:22px}
.imi.etkin circle{r:17px}
.imi.genel circle{stroke-dasharray:4 3}
.imi.uzak{opacity:.6}
.bag{stroke:var(--murekkep);stroke-width:1}
.s-teyitli circle{fill:var(--sinyal)}.s-teyitli text{fill:#fff}
.s-kismen circle,.s-tek-kaynak circle,.s-celiskili circle{fill:var(--yuzey);stroke:#b07a1e}.s-kismen text,.s-tek-kaynak text,.s-celiskili text{fill:var(--orta)}
.s-kanit-yok circle{fill:var(--yuzey);stroke:var(--soluk)}.s-kanit-yok text{fill:var(--soluk)}
#kure3{position:absolute;inset:0;overflow:hidden;display:none}
.harita.uc{background:var(--yuzey2)}.harita.uc #kure3{display:block}.harita.uc #svg{visibility:hidden}
.ikon{display:inline-block;flex:none;width:18px;height:18px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.im3{position:relative;display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--yuzey);border-radius:50%;background:var(--orta);color:#fff;box-shadow:var(--golge2);cursor:pointer;pointer-events:auto}
.im3 .ikon{width:30px;height:30px}
.im3.s-teyitli{background:var(--sinyal)}
.im3.s-kanit-yok{background:var(--yuzey);color:var(--soluk);border-color:var(--kiyi)}
.im3.genel{border-style:dashed}
.im3.yigin{width:36px;height:36px;background:var(--yuzey);color:var(--murekkep);border-color:var(--kiyi);font:600 13px/1 var(--baslik)}
.im3.etkin{outline:2px solid var(--murekkep);outline-offset:2px}
.im3 small{position:absolute;right:-6px;top:-6px;min-width:16px;height:16px;padding:0 2px;border-radius:8px;background:var(--murekkep);color:#fff;font:600 11px/16px var(--govde);text-align:center}
.im3ad{position:absolute;left:calc(100% + 8px);top:50%;translate:0 -50%;white-space:nowrap;padding:0 var(--s1);border-radius:2px;background:var(--yuzey);color:var(--murekkep);font:500 13px/20px var(--govde);box-shadow:var(--golge)}
.im3ad.meydan{background:var(--murekkep);color:#fff;font:600 12px/20px var(--baslik);letter-spacing:.06em}
#kure3 gmp-map-3d{display:block;width:100%;height:100%}
.ucak3{filter:drop-shadow(0 0 1px #152a38) drop-shadow(0 1px 2px #152a38)}
.ucak3 i{display:block;width:32px;height:32px;background:#fff;-webkit-mask:url(/ikon/flight.svg) center/contain no-repeat;mask:url(/ikon/flight.svg) center/contain no-repeat}
.uc3{padding:0 6px;border-radius:2px;background:var(--murekkep);color:#fff;font:600 12px/18px var(--baslik);letter-spacing:.06em;translate:0 -24px;pointer-events:none}
.ilgi .ikon{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.notam-duz{font-size:14px;margin-top:4px}
.uydular{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);margin-top:var(--s2)}
.uydular figure{margin:0;min-width:0}
.uydular img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--yuzey2);border-radius:4px}
.uydular a+a img{margin-top:var(--s1)}
.uydular figcaption{margin-top:var(--s1);font-size:13px;line-height:1.4}
.uydular figcaption b{font:600 13px/1.4 var(--baslik);letter-spacing:.06em}
.uydular small{display:block;color:var(--soluk);font-size:12px}
.uydu-yorum{margin:var(--s1) 0 4px;font-size:14px;line-height:1.45}
.uydu-yorum.dikkat{color:var(--orta);font-weight:500}
.notam-not{font-size:12px;color:var(--soluk);margin-top:4px}
.gosterge{z-index:1;position:absolute;right:var(--s2);top:var(--s2);display:grid;gap:4px;padding:var(--s1) var(--s2);background:var(--yuzey);border:1px solid var(--cizgi);border-radius:6px;box-shadow:var(--golge);font-size:12px}
.gosterge[hidden]{display:none}
.gosterge span{display:flex;gap:var(--s1);align-items:center}
.gosterge span[hidden]{display:none}
.gosterge i{width:12px;height:12px;border-radius:50%;border:2px solid #b07a1e}
.gosterge .d{background:var(--sinyal);border-color:var(--sinyal)}.gosterge .y{border-color:var(--soluk)}.gosterge .k{border-style:dashed;border-color:var(--murekkep)}
.gosterge b{color:var(--sinyal)}
.ray{overflow:auto;min-height:0;padding:0 4px var(--s6) 0;mask-image:linear-gradient(#000 calc(100% - 24px),transparent)}
.etiketli{font:600 12px/1.4 var(--baslik);letter-spacing:.1em;text-transform:uppercase;color:var(--soluk)}
.kartc{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:6px;box-shadow:var(--golge2);padding:var(--s3);margin-bottom:var(--s2)}
.acilis .soru-bas{font:600 24px/1.2 var(--baslik);color:var(--koyu);margin-bottom:var(--s2)}
.ornek{display:block;width:100%;height:auto;text-align:left;text-transform:none;letter-spacing:0;background:none;border:0;border-top:1px solid var(--cizgi);border-radius:0;color:inherit;padding:var(--s2) 0;font:400 16px/1.4 var(--govde)}
.ornek:hover{background:none;box-shadow:none;transform:none;color:var(--sinyal)}
.ornek b{display:block;font:600 12px/1.6 var(--baslik);letter-spacing:.1em;text-transform:uppercase;color:var(--soluk)}
.seritler{display:flex;flex-wrap:wrap;gap:var(--s1);margin-bottom:var(--s2)}
.serit-d{height:32px;padding:0 var(--s2);background:var(--yuzey);color:var(--murekkep);border-color:var(--cizgi);font:500 12px/1 var(--govde);letter-spacing:0;text-transform:none}
.serit-d:hover{background:var(--yuzey);border-color:var(--murekkep);box-shadow:none;transform:none}
.serit-d[aria-current]{background:var(--murekkep);color:#fff;border-color:var(--murekkep)}
.adimlar{list-style:none;font-size:14px}
.adimlar li{padding:var(--s1) 0;border-top:1px solid var(--cizgi)}
.adimlar li:first-child{border-top:0}
.adimlar li:last-child{font-weight:600}
.karar{font:600 28px/1.15 var(--baslik);color:var(--koyu);margin:var(--s1) 0}
.durum-rozet{margin-bottom:var(--s1)}
.rozet.durum-kirmizi{color:var(--sinyal);background:var(--sinyal-z)}
.rozet.durum-kahve{color:var(--orta);background:var(--orta-z)}
.karar.yok{color:var(--orta)}
.alt{font-size:14px;color:var(--soluk)}
.sayilar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--cizgi)}
.sayilar b{display:block;font:600 32px/1 var(--baslik);color:var(--koyu)}
.sayilar span{display:block;margin-top:4px;font:500 12px/1.3 var(--baslik);letter-spacing:.06em;text-transform:uppercase;color:var(--soluk)}
.dipnot{font-size:12px;color:var(--soluk);margin-top:var(--s2)}
.notam .sat{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline}
.notam-oz{font-size:14px;color:var(--soluk);margin-top:4px}
.notam .kanit .ceviri{color:var(--murekkep);font-size:14px;font-weight:600}
.notam .kanit q{font:400 13px/1.45 var(--govde);color:var(--soluk)}
.bulgular{list-style:none}
.resmi-liste{margin:0 0 var(--s1);padding-left:var(--s2)}.resmi-liste li{margin:0 0 var(--s1)}.resmi-liste b{display:block;font-weight:600}.resmi-liste span{display:block;color:var(--soluk);font-size:14px;line-height:20px}
.bulgu .tg{grid-column:1/-1;position:relative;margin:calc(-1 * var(--s2)) calc(-1 * var(--s2)) var(--s2);overflow:hidden;border-radius:5px 5px 0 0}
.bulgu .tg img{display:block;width:100%;aspect-ratio:16/5;object-fit:cover;filter:saturate(.9)}
.bulgu .tg figcaption{position:absolute;left:var(--s1);bottom:var(--s1);padding:2px var(--s1);background:rgba(21,42,56,.78);color:#fbfbf9;font:600 11px/16px var(--baslik);letter-spacing:.06em;text-transform:uppercase;border-radius:2px}
.bulgu{display:grid;grid-template-columns:32px minmax(0,1fr);gap:0 var(--s1);padding:var(--s2);margin-bottom:var(--s1);background:var(--yuzey);border:1px solid var(--cizgi);border-left:2px solid var(--kiyi);border-radius:6px;box-shadow:var(--golge);transition:box-shadow .12s,border-color .12s}
.bulgu.b-teyitli{border-left-color:var(--sinyal)}
.bulgu.b-kismen,.bulgu.b-tek-kaynak,.bulgu.b-celiskili{border-left-color:#b07a1e}
.bulgu.etkin{box-shadow:var(--golge2);border-color:var(--kiyi)}
.no{font:600 13px/24px var(--govde);width:24px;height:24px;text-align:center;border-radius:50%;background:var(--yuzey2);color:var(--soluk)}
.b-teyitli .no{background:var(--sinyal);color:#fff}
.b-kismen .no,.b-tek-kaynak .no,.b-celiskili .no{background:var(--orta-z);color:var(--orta)}
.ust-sira{display:flex;flex-wrap:wrap;gap:4px var(--s1);align-items:center}
.rozet{display:inline-flex;align-items:center;gap:var(--s1);font:600 12px/16px var(--baslik);letter-spacing:.08em;text-transform:uppercase;padding:2px var(--s1);border-radius:2px;color:var(--soluk);background:var(--yuzey2)}
.rozet::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b-teyitli .rozet{color:var(--sinyal);background:var(--sinyal-z)}
.b-kismen .rozet,.b-tek-kaynak .rozet,.b-celiskili .rozet{color:var(--orta);background:var(--orta-z)}
.ilgi{font:500 12px/16px var(--baslik);letter-spacing:.06em;text-transform:uppercase;color:var(--soluk)}
.iddia{font-size:16px;font-weight:500;margin:var(--s1) 0 4px}
.meta{font-size:12px;color:var(--soluk)}
details{grid-column:2;margin-top:var(--s1);font-size:14px}
summary{cursor:pointer;font-weight:500}
summary:hover{color:var(--sinyal)}
.elenen{font-size:12px;color:var(--soluk);margin:0 0 var(--s2)}
.elenen li{margin:4px 0 0 var(--s2)}
.kanit{padding:var(--s1) 0 var(--s1) var(--s2);border-left:2px solid var(--cizgi);margin-top:var(--s1)}
.kanit q{display:block;font:500 15px/1.4 var(--govde);quotes:none}
.kanit .ceviri{color:var(--soluk)}
.kaynak{font-size:12px;color:var(--soluk)}
.not{margin:var(--s2) 0;font-size:12px;color:var(--soluk)}
.hata{color:var(--sinyal);font-weight:500;overflow-wrap:anywhere}
.sahne-gorsel{position:absolute;inset:0;z-index:2;margin:0;background:var(--murekkep);color:#fff;overflow:hidden}
.sahne-gorsel[hidden]{display:none}
.sahne-gorsel img{display:block;width:100%;height:100%;object-fit:cover}
.ust-sol{position:absolute;left:var(--s2);top:var(--s2);display:flex;align-items:stretch}
.etiket{background:var(--yuzey);color:var(--murekkep);font:600 12px/16px var(--baslik);letter-spacing:.1em;padding:4px var(--s1)}
.yer{background:var(--murekkep);font-size:14px;font-weight:500;padding:4px var(--s1);line-height:16px}
.anahtar{position:absolute;right:var(--s2);top:var(--s2);display:grid;gap:4px;padding:var(--s1);background:var(--murekkep);border-radius:4px;font-size:12px}
.anahtar span{display:flex;gap:var(--s1);align-items:center}
.anahtar i{width:24px;height:8px;background:var(--r)}
.anahtar .serit{background:repeating-linear-gradient(90deg,#fff 0 6px,var(--murekkep) 6px 12px);outline:1px solid #fff}
.olcekcik{display:block;height:6px;margin-top:4px;border:1px solid #fff;border-top:0}
.kunye{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(2,auto) minmax(0,1fr);gap:var(--s3);align-items:end;padding:var(--s2);background:var(--murekkep);font-size:14px}
.kunye b{display:block;font:600 12px/1.4 var(--baslik);letter-spacing:.08em;color:var(--kiyi)}
.kunye small{font-size:12px;text-align:right;color:var(--kiyi)}
.adim-sec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s1);list-style:none;margin:0 0 var(--s2)}
.adim-sec button{width:100%;height:auto;padding:var(--s1);background:var(--yuzey);color:var(--murekkep);border-color:var(--cizgi);font:500 14px/1.3 var(--govde);letter-spacing:0;text-transform:none;text-align:left}
.adim-sec button:hover{border-color:var(--murekkep);box-shadow:none;transform:none}
.maxar{margin:0 0 var(--s2)}.maxar h3{font:600 12px/16px var(--baslik);letter-spacing:.08em;text-transform:uppercase;color:var(--soluk);margin:0 0 var(--s1)}
.maxar ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s1);list-style:none;margin:0 0 var(--s1);padding:0}
.maxar button{display:block;width:100%;height:auto;padding:0;background:none;border:1px solid var(--cizgi);text-align:left;font:500 13px/1.3 var(--govde);letter-spacing:0;text-transform:none;color:var(--murekkep)}
.maxar button[aria-pressed="true"]{border-color:var(--murekkep);outline:2px solid var(--murekkep)}
.maxar img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.maxar button span{display:block;padding:4px var(--s1)}
.maxar p{font-size:12px;line-height:16px;color:var(--soluk);margin:0}
.adim-sec button[aria-current]{background:var(--murekkep);border-color:var(--murekkep);color:#fff}
.senaryo{font-size:14px;margin-bottom:var(--s2);padding:var(--s1) var(--s2);background:var(--yuzey2);border:1px solid var(--cizgi);border-radius:4px}
.senaryo b{font:600 12px var(--baslik);letter-spacing:.1em;color:var(--murekkep)}
.durumlar{font:600 12px/1.4 var(--baslik);letter-spacing:.08em;margin-bottom:var(--s2);color:var(--onay)}
.durumlar.yok{color:var(--orta)}
.kart{margin:0}
.kart div.satir{display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--s2);padding:var(--s1) 0;border-top:1px solid var(--cizgi)}
.kart dt{font:600 12px/16px var(--baslik);letter-spacing:.08em;color:var(--soluk);padding-top:4px}
.kart dd{margin:0}
.kart .neden{border-top:2px solid var(--murekkep)}
.kart .neden dd{font:600 16px/1.4 var(--govde);color:var(--koyu)}
.kart .takip{display:block;font:600 12px var(--baslik);letter-spacing:.08em;color:var(--orta)}
.yontem{margin:var(--s1) 0 0;display:grid;gap:4px;font-size:12px}
.yontem p{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:var(--s1);align-items:center}
.yontem i{display:block;height:8px;background:var(--yuzey2);border-radius:1px}
.yontem i span{display:block;height:100%;background:var(--murekkep)}
.yontem.yok i span{background:#b07a1e}
.yontem em{font-style:normal;text-align:right;font-weight:600}
.ucuslar{list-style:none;margin:var(--s1) 0 0;padding:0;font-size:14px;color:var(--soluk)}
@media (max-width:1320px){.kutu.tarih{flex-basis:144px}.sahne-ac{display:none}}
@media (max-width:1180px){.ust{gap:var(--s2)}button{padding:0 var(--s2)}}
@media (max-width:860px){
  .ekran{display:block;height:auto;padding:0}
  .ust{grid-template-columns:auto auto;margin:0;padding:var(--s1) var(--s2);gap:var(--s1);justify-content:space-between}
  .damga{font-size:24px}
  .dil button{height:44px}
  form{grid-column:1/-1;grid-row:2;flex-wrap:wrap}
  .mod{flex-basis:100%}
  .mod button{flex:1}
  .kutu{flex-basis:calc(50% - 4px)}
  .oneri{min-width:0;width:100%}
  .kutu.tarih{flex-basis:100%}
  form button{flex:1;padding:0 var(--s1);letter-spacing:.04em;white-space:nowrap}
  .harita{height:32vh;min-height:240px;position:relative;border-width:0 0 1px;border-radius:0;box-shadow:none}
  .harita:has(.sahne-gorsel:not([hidden])){height:56vh}
  input{font-size:14px;padding:0 var(--s1)}
  .gosterge,.anahtar{display:none}
  .ray{overflow:visible;padding:var(--s2);mask-image:none}
  .notam .kanit q{font-size:12px}
  .karar{font-size:24px}
  .kartc{padding:var(--s2)}
  button,summary{min-height:44px}
  summary{display:flex;align-items:center;gap:var(--s1)}
  .kunye{grid-template-columns:1fr 1fr;gap:var(--s1);padding:var(--s1) var(--s2)}.kunye small{grid-column:1/-1;text-align:left}
  .kart div.satir{grid-template-columns:1fr;gap:4px}
  .sahne-gorsel img{transform:scale(1.7)}
  .yer{font-size:12px}
  .adim-sec button{font-size:12px;padding:var(--s1) 4px}
}
@media (prefers-reduced-motion:reduce){.ciz{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="ekran">
  <header class="ust">
    <h1 class="damga">SEZ</h1>
    <form id="form">
      <div class="mod" role="group">
        <button type="button" data-mod="rota" data-t="modRota"></button>
        <button type="button" data-mod="ulke" data-t="modUlke"></button>

      <button id="gonder" type="submit" data-t="kanitla"></button>
      <button id="sahneAc" class="sahne-ac" type="button" data-t="sahneDugme"></button>
    </form>
    <div class="dil" role="group" aria-label="Language / Dil">
      <button type="button" data-dil="en">EN</button>
      <button type="button" data-dil="tr">TR</button>
    </div>
  </header>
  <p class="duyulan" id="duyulan" role="status" hidden></p>
  <main class="harita" id="harita">
    <svg id="svg" role="img"></svg>
    <div id="kure3"></div>
    <div class="gosterge" id="gosterge" hidden>
      <span data-g="teyitli"><i class="d"></i><em data-t="gTeyitli" style="font-style:normal"></em></span>
      <span data-g="zayif"><i></i><em data-t="gZayif" style="font-style:normal"></em></span>
      <span data-g="kanit-yok"><i class="y"></i><em data-t="gYok" style="font-style:normal"></em></span>
      <span data-g="genel"><i class="k"></i><em data-t="gGenel" style="font-style:normal"></em></span>
      <span data-g="kapali"><b>- -</b><em data-t="gKapali" style="font-style:normal"></em></span>
    </div>
    <figure class="sahne-gorsel" id="sahneGorsel" hidden>
      <img id="sahneResim" alt="">
      <div class="ust-sol"><span class="etiket" data-t="senaryo"></span><span class="yer" id="sahneYer"></span></div>
      <div class="anahtar" id="anahtar"></div>
      <figcaption class="kunye">
        <span><b data-t="cekim"></b><span id="cekim"></span></span>
        <span><b data-t="isleme"></b><span id="isleme"></span></span>
        <small><span id="anahtarMetin"></span><span id="sahneAd"></span> · <span data-t="copernicus"></span></small>
      </figcaption>
    </figure>
  </main>
  <aside class="ray" id="ray" aria-live="polite"></aside>
</div>

// Tarayicinin datalist'i yazilan metni icermeyen satiri gizler (kahire -> Cairo), bu yuzden liste bizde.
function oneriBagla(girdi, liste) {
  let aramaZamani, sonuc = [], secili = -1;
  const kapat = () => { liste.replaceChildren(); sonuc = []; secili = -1; };
  const sec = (h) => { girdi.value = `${h.iata} · ${h.ad}, ${h.sehir}`; kapat(); };
  const isaretle = () => [...liste.children].forEach((li, i) => { li.setAttribute("aria-selected", String(i === secili)); if (i === secili) li.scrollIntoView({ block: "nearest" }); });
  girdi.addEventListener("input", () => {
    clearTimeout(aramaZamani);
    if (mod !== "rota" || girdi.value.includes(" · ")) { kapat(); return; }
    aramaZamani = setTimeout(async () => {
      const q = girdi.value;
      const l = await (await fetch(`/api/havalimani?q=${encodeURIComponent(q)}`)).json();
      if (q !== girdi.value || mod !== "rota" || document.activeElement !== girdi) return; // gec gelen eski cevap listeyi ezmesin
      sonuc = l; secili = -1;
      liste.replaceChildren(...l.map((h) => {
        const li = el("li", null, `${h.iata} · ${h.ad}, ${h.sehir}`);
        li.setAttribute("role", "option");
        li.onmousedown = (e) => { e.preventDefault(); sec(h); };
        return li;
      }));
    }, 150);
  });
  girdi.addEventListener("keydown", (e) => {
    if (!sonuc.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      secili = (secili + (e.key === "ArrowDown" ? 1 : sonuc.length - 1 + (secili < 0 ? 1 : 0))) % sonuc.length;
      isaretle();
    } else if (e.key === "Enter") {
      e.preventDefault(); // listedeki ilk satir secilir, soru henuz gitmez
      sec(sonuc[Math.max(secili, 0)]);
    } else if (e.key === "Escape") kapat();
  });
  girdi.addEventListener("blur", kapat);
}

  const duzelt = (p) => (d3.geoArea({ type: "Polygon", coordinates: p }) > 2 * Math.PI ? p.map((h) => [...h].reverse()) : p);
  dunya = topojson.feature(t, t.objects.countries).features.map((f) => ({
    ...f,
    geometry: f.geometry.type === "Polygon"
      ? { type: "Polygon", coordinates: duzelt(f.geometry.coordinates) }

  }));
  ciz(null);

  if (adres.has("sahne")) { sahneAc(+adres.get("sahne") || 0); return; }
  const geri = JSON.parse(sessionStorage.getItem("sezGeri") ?? "null");

}

// Google 3D harita: hat, koridor, olaylar ve kamera. Anahtar yoksa ya da yuklenemezse SVG harita kalir.

const enlem = ([lng, lat]) => ({ lat, lng });

function gKur() {
  gHazir ??= (async () => {
    const { anahtar } = await (await fetch("/api/ayar")).json();
    if (!anahtar || !document.createElement("canvas").getContext("webgl2")) return false;
    // Google anahtari yuklemeden sonra reddederse ekran bos kalmaz, duz haritaya donulur.
    // 3D harita gm_authFailure cagirmiyor, hatayi yalniz konsola yaziyor (gecersiz anahtarla olculdu).
    const yazici = console.error;
    console.error = (...a) => {
      yazici(...a);
      if (!String(a[0]).includes("Google Maps JavaScript API error") || !gm) return;
      cancelAnimationFrame(ucakKare);
      gm.remove(); gm = null;
      gHazir = Promise.resolve(false);
      $("harita").classList.remove("uc");
    };
    await new Promise((tamam, red) => {
      const b = document.createElement("script");
      window.gYuklendi = tamam;
      b.src = `https://maps.googleapis.com/maps/api/js?loading=async&callback=gYuklendi&key=${encodeURIComponent(anahtar)}&libraries=maps3d,marker&language=${dil}`;
      b.onerror = red;
      document.head.append(b);
    });
    const { Map3DElement } = await google.maps.importLibrary("maps3d");
    await google.maps.importLibrary("marker");
    gm = new Map3DElement({ center: { lat: 25, lng: 30, altitude: 0 }, range: 1.8e7, tilt: 0, mode: "HYBRID", defaultUIHidden: true });
    $("kure3").append(gm);
    $("harita").classList.add("uc");
    return true;
  })().catch((e) => { console.error(e); return false; });
  return gHazir;
}

// Koridor, hattin iki yanina km cinsinden acilan seridin kendisidir.
function koridorSeridi(rota, km) {
  const r = km / 6371, rad = Math.PI / 180;
  const yana = ([lon, lat], yon) => {
    const [f, l] = [lat * rad, lon * rad];
    const f2 = Math.asin(Math.sin(f) * Math.cos(r) + Math.cos(f) * Math.sin(r) * Math.cos(yon));
    return [(l + Math.atan2(Math.sin(yon) * Math.sin(r) * Math.cos(f), Math.cos(r) - Math.sin(f) * Math.sin(f2))) / rad, f2 / rad];
  };
  const sag = [], sol = [];
  rota.forEach((n, i) => {
    const yon = yonu(rota[Math.max(i - 1, 0)], rota[Math.min(i + 1, rota.length - 1)]);
    sag.push(yana(n, yon + Math.PI / 2)); sol.push(yana(n, yon - Math.PI / 2));
  });
  return [...sag, ...sol.reverse()].map(enlem);
}

function yonu(a, b) {
  const rad = Math.PI / 180, [f1, f2, dl] = [a[1] * rad, b[1] * rad, (b[0] - a[0]) * rad];
  return Math.atan2(Math.sin(dl) * Math.cos(f2), Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl));
}

function ikonAdi(b) {
  if (b.tehlike !== "hava") return IKON[b.tehlike] ?? "warning";
  const m = `${b.iddia ?? ""} ${b.iddiaEn ?? ""}`.toLocaleLowerCase("tr");
  return [[/kar yağ|tipi|snow|blizzard/, "weather_snowy"], [/tayfun|kasırga|hortum|hurricane|typhoon|cyclone|tornado/, "cyclone"], [/gök gürültü|thunder/, "thunderstorm"], [/rüzgar|fırtına|wind|storm|gale/, "air"], [/\bsis\b|fog|mist/, "foggy"], [/yağmur|sağanak|rain/, "rainy"]].find(([r]) => r.test(m))?.[1] ?? "thunderstorm";
}

function isaretKoy(lat, lng, icerik) {

const KUME_ACI = [-90, 90, 180, -135, 135];

function olayIsaretleri(s) {
  const yerler = [], hedef = s.hedef ?? {}, etiketli = new Set();
  // Ayni yerdeki isaretler halkaya dizilir; sag taraf ilk isaretin etiketine birakilir.
  const halka = (d, sira) => {
    const aci = KUME_ACI[sira - 1] ?? sira * 60;
    d.style.translate = `${58 * Math.cos(aci * Math.PI / 180)}px ${58 * Math.sin(aci * Math.PI / 180)}px`;
  };
  s.bulgular.forEach((b, i) => {
    if (!b.konum) return;
    const [lng, lat] = b.konum.nokta;
    let yer = yerler.find((p) => d3.geoDistance(p.nokta, [lng, lat]) * 6371 < 120);
    // Kanitsiz iddialar ayni noktada isaret yigmaz: tek rozette toplanir, ayrintisi listededir.
    if (yer && b.seviye === "kanit-yok") { yer.kanitsiz.push(i); return; }
    if (!yer) { yer = { nokta: [lng, lat], dolu: 0, kanitsiz: [] }; yerler.push(yer); }
    const kume = yer.dolu++;
    const genel = b.konum.tur === "ulke" && b.iliski !== "koridorda";
    const tehlike = T().tehlike[b.tehlike] ?? T().tehlike.diger;
    const d = el("div", `im3 s-${b.seviye}${genel ? " genel" : ""}${b.iliski === "bolgesel" ? " uzak" : ""}`);
    d.dataset.no = i; d.title = tehlike; d.tabIndex = 0; d.setAttribute("role", "button"); d.setAttribute("aria-label", `${i + 1}, ${tehlike}`);
    if (kume) halka(d, kume);
    d.append(ikon(ikonAdi(b)), el("small", null, i + 1));
    // Meydandaki olayda meydan kodu ikonun yanina gecer: ayri etiket ikonun ustune binmesin.
    const meydan = hedef.rota && [hedef.kalkis, hedef.varis].find((u) => d3.geoDistance(u.nokta, [lng, lat]) * 6371 < 60);
    if (meydan && !kume && !etiketli.has(meydan.iata)) { etiketli.add(meydan.iata); d.append(el("span", "im3ad meydan", meydan.iata)); }
    else if (!meydan && b.seviye !== "kanit-yok" && !kume) d.append(el("span", "im3ad", b.konum.tur === "ulke" ? ulkeAd(b.konum.ad) : b.konum.ad));
    d.onmouseenter = () => vurgula(i);
    d.onclick = () => { vurgula(i); document.getElementById(`bulgu-${i}`)?.scrollIntoView({ behavior: "smooth", block: "nearest" }); };
    isaretKoy(lat, lng, d);
  });
  for (const y of yerler) {
    if (!y.kanitsiz.length) continue;
    const d = el("div", "im3 yigin", `+${y.kanitsiz.length}`);
    d.title = T().kanitsizAd(y.kanitsiz.length); d.tabIndex = 0; d.setAttribute("role", "button"); d.setAttribute("aria-label", d.title);
    halka(d, y.dolu);
    d.onclick = () => document.getElementById(`bulgu-${y.kanitsiz[0]}`)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    isaretKoy(y.nokta[1], y.nokta[0], d);
  }
  for (const u of hedef.rota ? [hedef.kalkis, hedef.varis] : []) if (!etiketli.has(u.iata)) isaretKoy(u.nokta[1], u.nokta[0], el("div", "uc3", u.iata));
}

// Hat boyunca giden ucak: burnu gercek gidis yonune, kamera acisi dusulerek bakar.
function ucakBaslat(rota) {
  cancelAnimationFrame(ucakKare);
  if (!rota || sakin) return;
  const yol = [0];
  rota.forEach((n, i) => { if (i) yol.push(yol[i - 1] + d3.geoDistance(rota[i - 1], n)); });
  const toplam = yol.at(-1), t0 = performance.now(), SURE = 14000;
  const konum = (o) => {
    const h = o * toplam, i = Math.max(1, yol.findIndex((v) => v >= h));
    return d3.geoInterpolate(rota[i - 1], rota[i])((h - yol[i - 1]) / (yol[i] - yol[i - 1] || 1));
  };
  const u = el("div", "ucak3"); u.append(el("i"));
  const m = isaretKoy(rota[0][1], rota[0][0], u);
  let son = 0;
  const kare = (z) => {
    if (z - son > 40) {
      son = z;
      const o = ((z - t0) % SURE) / SURE, p = konum(o), q = konum(Math.min(1, o + .003));
      m.position = enlem(p);
      if (q[0] !== p[0]) u.style.rotate = `${yonu(p, q) * 180 / Math.PI - (gm.heading ?? 0)}deg`;
    }
    ucakKare = requestAnimationFrame(kare);
  };
  ucakKare = requestAnimationFrame(kare);
}

async function kureGoster(s) {
  if (!(await gKur())) return;
  if (s && s !== sonSonuc) return; // bu arada yeni sorgu geldi
  const { Polyline3DElement, Polygon3DElement } = await google.maps.importLibrary("maps3d");
  cancelAnimationFrame(ucakKare);
  nesneler.forEach((n) => n.remove()); nesneler = [];
  const sira = ++kameraSirasi;
  gm.stopCameraAnimation?.();
  if (!s) { gm.flyCameraTo({ endCamera: { center: { lat: 25, lng: 30, altitude: 0 }, range: 1.8e7, tilt: 0, heading: 0 }, durationMillis: sakin ? 0 : 1500 }); return; }
  const hedef = s.hedef ?? {}, rota = hedef.rota;
  if (rota) {
    const koridor = new Polygon3DElement({ path: koridorSeridi(rota, s.koridorKm ?? 150), fillColor: "#ffffff30", strokeWidth: 0, altitudeMode: "CLAMP_TO_GROUND", drawsOccludedSegments: true });
    const hat = new Polyline3DElement({ path: rota.map(enlem), strokeColor: "#ffffff", strokeWidth: 3, outerColor: "#152a38", outerWidth: .5, altitudeMode: "CLAMP_TO_GROUND", drawsOccludedSegments: true });
    gm.append(koridor, hat); nesneler.push(koridor, hat);
  }
  for (const k of s.kesisim ?? []) for (const p of k.parcalar) {
    const c = new Polyline3DElement({ path: p.map(enlem), strokeColor: "#a3362f", strokeWidth: 5, altitudeMode: "CLAMP_TO_GROUND", drawsOccludedSegments: true });
    gm.append(c); nesneler.push(c);
  }
  olayIsaretleri(s);
  ucakBaslat(rota);
  const ulke = hedef.ulke && dunya.find((f) => f.properties.name === hedef.ulke);
  const noktalar = [...(rota ?? []), ...s.bulgular.filter((b) => b.konum && (!rota || b.iliski !== "bolgesel")).map((b) => b.konum.nokta)];
  const nesne = ulke ?? { type: "MultiPoint", coordinates: noktalar };
  const [mlng, mlat] = d3.geoCentroid(nesne);
  const yay = Math.max(.03, ...(ulke ? d3.geoBounds(ulke) : noktalar).map((p) => d3.geoDistance(p, [mlng, mlat]))); // radyan
  const range = Math.min(1.8e7, yay * 6371e3 * 3.4);
  const son = sonKamera = { center: { lat: mlat, lng: mlng, altitude: 0 }, range, tilt: range < 6e6 ? 45 : 0, heading: 0 };
  if (sakin || !rota) { gm.flyCameraTo({ endCamera: son, durationMillis: sakin ? 0 : 2500 }); return; }
  gm.flyCameraTo({ endCamera: { center: { ...enlem(hedef.kalkis.nokta), altitude: 0 }, range: Math.max(range, 3e6), tilt: 20, heading: 0 }, durationMillis: 1800 });
  gm.addEventListener("gmp-animationend", () => { if (sira === kameraSirasi) gm.flyCameraTo({ endCamera: son, durationMillis: 3000 }); }, { once: true });
}

function ciz(s, kamera = true) {
  const { width: w, height: h } = svg.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.replaceChildren();
  const hedef = s?.hedef ?? {};
  const rota = hedef.rota;
  // Uzak bolgesel gelisme haritayi kuculturmesin: cerceve rotaya ve rotaya yakin olaylara gore kurulur.
  const noktalar = [...(rota ?? []), ...((s?.bulgular ?? []).filter((b) => b.konum && (!rota || b.iliski !== "bolgesel")).map((b) => b.konum.nokta))];
  const ulke = hedef.ulke && dunya.find((f) => f.properties.name === hedef.ulke);
  const nesne = ulke ?? (noktalar.length ? { type: "MultiPoint", coordinates: noktalar } : { type: "Sphere" });
  const merkez = d3.geoCentroid(nesne.type === "Sphere" ? { type: "Point", coordinates: [30, 25] } : nesne);
  // Uzun hat kure uzerinde gosterilir; ortasi ekranin merkezinden kaydirilinca yay kavisli gorunur.
  const kure = rota && d3.geoLength({ type: "LineString", coordinates: rota }) * 6371 > 6000;
  const orta = rota && d3.geoCentroid({ type: "LineString", coordinates: rota });
  const izdusum = kure
    ? d3.geoOrthographic().rotate([-orta[0], -(orta[1] + (orta[1] > 0 ? -24 : 24))]).fitExtent([[24, 24], [w - 24, h - 24]], { type: "Sphere" })
    : (nesne.type === "Sphere" ? d3.geoNaturalEarth1() : d3.geoAzimuthalEquidistant().rotate([-merkez[0], -merkez[1]]).clipAngle(90)).fitExtent([[64, 56], [w - 64, h - 56]], nesne);
  const yol = d3.geoPath(izdusum);
  if (kure) svg.append(sv("path", { class: "kure", d: yol({ type: "Sphere" }) }));
  svg.append(sv("path", { class: "ag", d: yol(d3.geoGraticule10()) }));
  const gecilen = new Set(hedef.ulkeler ?? (hedef.ulke ? [hedef.ulke] : []));
  for (const f of dunya) {
    const d = yol(f);
    if (d) svg.append(sv("path", { class: "kara" + (gecilen.has(f.properties.name) ? " gecilen" : ""), d }));
  }
  if (rota) {
    const km1 = 1 / 6371 * 180 / Math.PI; // bir kilometrenin derece karsiligi
    const [a, b] = [izdusum(merkez), izdusum([merkez[0], merkez[1] + km1 * 100])];
    const pikselKm = Math.hypot(a[0] - b[0], a[1] - b[1]) / 100;
    svg.append(sv("path", { class: "koridor", d: yol({ type: "LineString", coordinates: rota }), "stroke-width": Math.max(8, 2 * (s.koridorKm ?? 150) * pikselKm) }));
    svg.append(sv("path", { class: "yol ciz", d: yol({ type: "LineString", coordinates: rota }), pathLength: 1, "stroke-dasharray": 1 }));
    for (const u of [hedef.kalkis, hedef.varis]) {
      const [x, y] = izdusum(u.nokta);
      svg.append(sv("circle", { class: "uc", cx: x, cy: y, r: 6 }));
      const sol = x < w / 2;
      const t = sv("text", { class: "ucad", x: x + (sol ? -12 : 10), y: y - 10, style: `text-anchor:${sol ? "end" : "start"}` }); t.textContent = u.iata; svg.append(t);
    }
  }
  $("gosterge").hidden = !s;
  for (const k of s?.kesisim ?? []) for (const p of k.parcalar) svg.append(sv("path", { class: "kapali", d: yol({ type: "LineString", coordinates: p }) }));
  const gorunen = new Set((s?.bulgular ?? []).flatMap((b) => [b.seviye === "teyitli" ? "teyitli" : b.seviye === "kanit-yok" ? "kanit-yok" : "zayif", b.konum?.tur === "ulke" ? "genel" : ""]));
  if (s?.kesisim?.length) gorunen.add("kapali");
  document.querySelectorAll("[data-g]").forEach((e) => { e.hidden = !gorunen.has(e.dataset.g); });
  if (nesne.type !== "Sphere" && !kure) {
    const km = 1 / 6371 * 180 / Math.PI;
    const [a, b] = [izdusum(merkez), izdusum([merkez[0], merkez[1] + km * 100])];
    const pikselKm = Math.hypot(a[0] - b[0], a[1] - b[1]) / 100;
    const uzunluk = [100, 200, 500, 1000, 2000, 5000].find((u) => u * pikselKm >= 64) ?? 5000;
    const x2 = w - 24, x1 = x2 - uzunluk * pikselKm, yy = h - 24;
    svg.append(sv("path", { class: "olcek", d: `M${x1} ${yy - 4}V${yy}H${x2}V${yy - 4}` }));
    const t = sv("text", { class: "olcekad", x: (x1 + x2) / 2, y: yy - 8 }); t.textContent = `${uzunluk} km`; svg.append(t);
  }
  const yerler = [];
  (s?.bulgular ?? []).forEach((b, i) => {
    if (!b.konum) return;
    const [x0, y0] = izdusum(b.konum.nokta) ?? [-1, -1];
    if (x0 < 0 || y0 < 0 || x0 > w || y0 > h) return; // cerceve disindaki bolgesel olay yalniz listede kalir
    // Yakin isaretler ayni noktanin cevresine acilir, ince cizgi gercek yere baglar.
    const kume = yerler.filter((p) => Math.hypot(p.x0 - x0, p.y0 - y0) < 30).length;
    const aci = -Math.PI / 2 + kume * (Math.PI / 3);
    const [x, y] = kume ? [x0 + 34 * Math.cos(aci), y0 + 34 * Math.sin(aci)] : [x0, y0];
    yerler.push({ x0, y0 });
    if (kume) svg.append(sv("line", { class: "bag", x1: x0, y1: y0, x2: x, y2: y }));
    const genel = b.konum.tur === "ulke" && b.iliski !== "koridorda";
    const g = sv("g", { class: `imi s-${b.seviye}${genel ? " genel" : ""}${b.iliski === "bolgesel" ? " uzak" : ""}`, "data-no": i, tabindex: 0, role: "button", "aria-label": `${i + 1}` });
    g.append(sv("circle", { class: "dokun", cx: x, cy: y }));
    g.append(sv("circle", { cx: x, cy: y, r: 14 }));
    const t = sv("text", { x, y }); t.textContent = i + 1; g.append(t);
    if (b.seviye !== "kanit-yok" && !kume) { // kumedeki isaret numarayla yetinir, etiketler ust uste binmez
      // Kumenin isaretleri saga acilir; ilk isaretin etiketi onlarin altinda kalmasin diye sola gecer.
      const yakin = (s?.bulgular ?? []).some((o, j) => {
        const k = j > i && o.konum && izdusum(o.konum.nokta);
        return k && Math.hypot(k[0] - x0, k[1] - y0) < 30;
      });
      const sagda = !yakin && x < w - 180;
      const ad = sv("text", { class: "imad", x: x + (sagda ? 20 : -20), y, style: `text-anchor:${sagda ? "start" : "end"}` });
      ad.textContent = `${b.konum.tur === "ulke" ? ulkeAd(b.konum.ad) : b.konum.ad}, ${(T().tehlike[b.tehlike] ?? T().tehlike.diger).toLocaleLowerCase(dil)}`;
      g.append(ad);
    }
    g.onmouseenter = () => vurgula(i);
    g.onclick = () => { vurgula(i); document.getElementById(`bulgu-${i}`)?.scrollIntoView({ behavior: "smooth", block: "nearest" }); };
    svg.append(g);
  });
  if (kamera) kureGoster(s);
}

function vurgula(i) {
  document.querySelectorAll(".imi,.im3,.bulgu").forEach((e) => e.classList.toggle("etkin", +e.dataset.no === i));
}

function kanitKart(k) {

// Uydu canli degildir: sorulan gune kadarki son acik gecis, cekim saatiyle gosterilir.
const OLAY_UYDU = ["kul", "sel", "hava", "deprem"];

// Olay yerinin once ve sonrasi, acilinca istenir: haberden bagimsiz ikinci kanal, seviye hesabina girmez.
/** Karardan once bakilacak resmi kaynaklar: oneridir, SEZ bu sayfalari acmaz. Acilinca istenir. */
function resmiKart(b) {
  const dt = el("details", "olay-uydu");
  dt.append(el("summary", null, T().resmiBas));
  const alan = el("div");
  dt.append(alan);

    alan.replaceChildren(el("p", "notam-oz", T().resmiAra));
    const q = new URLSearchParams({ iddia: b.iddiaEn || b.iddia, tehlike: b.tehlike, ulke: b.ulke ?? "", iata: b.konum?.tur === "nokta" && /^[A-Z0-9]{3}$/.test(b.konum.ad) ? b.konum.ad : "" });
    const v = await (await fetch(`/api/resmi?${q}`)).json().catch(() => ({ hata: "ag" }));
    if (v.hata) { alan.replaceChildren(el("p", "notam-oz", T().resmiHata)); return; }
    const ol = el("ol", "resmi-liste");

    alan.replaceChildren(ol);

}

function olayUyduKart(b) {
  const dt = el("details", "olay-uydu");
  dt.append(el("summary", null, T().olayUydu));
  const alan = el("div");
  dt.append(alan);
  let v, isaret;
  const yereUc = () => {
    if (!gm || !v) return;
    gm.flyCameraTo({ endCamera: { center: { lat: v.lat, lng: v.lon, altitude: 0 }, range: 90_000, tilt: 55, heading: 0 }, durationMillis: sakin ? 0 : 3500 });
    if (isaret?.isConnected) return;
    const d = el("div", `im3 s-${b.seviye}`); d.append(ikon(ikonAdi(b)));
    isaret = isaretKoy(v.lat, v.lon, d);
  };

    if (!dt.open) { if (gm && sonKamera) gm.flyCameraTo({ endCamera: sonKamera, durationMillis: sakin ? 0 : 2500 }); return; }
    if (alan.dataset.yuklu) { yereUc(); return; }
    alan.dataset.yuklu = "1";
    alan.replaceChildren(el("p", "notam-oz", T().olayAra));
    const q = new URLSearchParams({ lon: b.konum.nokta[0], lat: b.konum.nokta[1], gun: b.olayTarihi, tehlike: b.tehlike, iddia: b.iddia });
    ({ sonuc: v } = await (await fetch(`/api/olay-uydu?${q}`)).json().catch(() => ({})));
    if (!v) { alan.replaceChildren(el("p", "notam-oz", T().olayYok)); return; }
    const liste = el("div", "uydular");
    for (const [kare, ad] of [[v.once, T().once], [v.sonra, T().olaySonra]]) {
      if (!kare) continue;
      const f = el("figure"), a = el("a"), g = el("img"), y = el("figcaption");
      a.href = `/api/uydu-gorsel?ad=${kare.ad}`; a.target = "_blank"; a.rel = "noopener";
      g.src = a.href; g.alt = `${ad}, ${kare.cekim.slice(0, 10)}`;
      a.append(g);
      y.append(el("b", null, ad), el("small", null, T().uyduKunye(kare.cekim.slice(0, 16).replace("T", " "), kare.bulut)));
      f.append(a, y);
      liste.append(f);
    }
    alan.replaceChildren(liste);
    if (v.yorum) alan.append(el("p", `uydu-yorum${v.yorum.uyumlu ? " dikkat" : ""}`, v.yorum[dil]));
    const rota = sonSonuc?.hedef?.rota;
    if (rota) alan.append(el("p", "notam-oz", T().olayUzak(Math.round(Math.min(...rota.map((n) => d3.geoDistance(n, [v.lon, v.lat]))) * 6371))));
    alan.append(el("small", "notam-not", T().olayNot(v.sonra.cekim.slice(0, 4))));
    if (dt.open) yereUc();
  });
  return dt;
}

    }).catch(() => { if (k.isConnected) yazi.lastChild.textContent = T().uyduYok; });

}

  const sayilar = el("div", "sayilar");
  for (const [n, ad] of [[s.bulgular.length + (s.elenen ?? 0), T().saTaranan], [kor, T().saTeyitli], [teyitli.length - kor, T().saKoridor]]) {
    const d = el("div"); d.append(el("b", null, n), el("span", null, ad)); sayilar.append(d);

  ust.append(sayilar);

let sahne = null, sahneAdim = 0;

async function sahneAc(i = 0) {

function sahneAnahtar(a) {

function sorgula(s, anahtar = s) {
  sonSoru = { s, k: anahtar };
  kaynak?.close();
  sahneKapat();
  gorunum = "yukleniyor";
  // Eski sorunun haritasi yeni sonuc gibi gorunmesin.
  sonSonuc = null;
  ciz(null);
  $("gonder").disabled = true;
  ray.replaceChildren();
  const kutu = el("div", "kartc"), liste = el("ol", "adimlar"); kutu.append(liste); ray.append(kutu);
  const bitir = () => { kaynak.close(); $("gonder").disabled = false; };
  kaynak = new EventSource(`/api/sor?s=${encodeURIComponent(s)}&k=${encodeURIComponent(anahtar)}`);
  kaynak.onmessage = (o) => {
    const d = JSON.parse(o.data);
    if (d.tip === "ilerleme") liste.append(el("li", null, dil === "en" ? d.en : d.metin));
    if (d.tip === "sonuc") { bitir(); goster(d.sonuc); }
    if (d.tip === "hata") { bitir(); ray.replaceChildren(el("p", "hata", dil === "en" ? d.en ?? d.metin : d.metin)); }
  };
  kaynak.onerror = () => { bitir(); ray.replaceChildren(el("p", "hata", T().baglanti)); };
}

// Sesli soru (Muse Voice Transcribe): mikrofon 16 kHz tek kanal WAV'a cevrilir, sunucu yalniz metni dondurur, ses saklanmaz.
let sesKayit = null;
function wavYap(parca, hz, hedef = 16000) {
  const ham = new Float32Array(parca.reduce((t, p) => t + p.length, 0));
  let o = 0; for (const p of parca) { ham.set(p, o); o += p.length; }
  const n = Math.floor(ham.length * hedef / hz), v = new DataView(new ArrayBuffer(44 + n * 2));
  const yaz = (k, s) => [...s].forEach((c, i) => v.setUint8(k + i, c.charCodeAt(0)));
  yaz(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); yaz(8, "WAVE"); yaz(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, hedef, true); v.setUint32(28, hedef * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); yaz(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const x = i * hz / hedef, a = Math.floor(x), f = x - a, d = ham[a] + ((ham[a + 1] ?? ham[a]) - ham[a]) * f;
    v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d)) * 0x7fff, true);
  }
  return v.buffer;
}
function duyulanGoster(metin, alt) {
  const d = $("duyulan");
  d.replaceChildren(document.createTextNode(metin));
  if (alt) d.append(el("small", null, alt));
  d.hidden = false;
  clearTimeout(d.zaman); d.zaman = setTimeout(() => { d.hidden = true; }, 9000);
}
// Duyulan soru bir ornekle ayni yerleri ve yili tasiyorsa kayitli sonuc acilir, para harcanmaz; degilse soru oldugu gibi sorulur.
function sesliSor(metin) {
  const k = metin.toLocaleLowerCase(dil);
  const ornek = ORNEKLER.find((o) => [o.a, o.b].filter(Boolean).every((y) => k.includes(y[dil].toLocaleLowerCase(dil))) && (!o.t || k.includes(o.t.slice(0, 4))));
  if (ornek) { ornekSor(ornek); return; }
  sonOrnek = null;
  sorgula(metin);
}
async function sesDugme() {
  const b = $("ses"), yazi = b.querySelector("span");
  if (!sesKayit) {
    try {
      const akis = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ac = new AudioContext(), kay = ac.createMediaStreamSource(akis), isl = ac.createScriptProcessor(4096, 1, 1), parca = [];
      isl.onaudioprocess = (e) => parca.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      kay.connect(isl); isl.connect(ac.destination);
      sesKayit = { akis, ac, isl, parca };
      b.setAttribute("aria-pressed", "true"); yazi.textContent = T().sesDur;
    } catch { duyulanGoster(T().sesIzin); }
    return;
  }
  const { akis, ac, isl, parca } = sesKayit;
  sesKayit = null;
  isl.disconnect(); akis.getTracks().forEach((t) => t.stop());
  const hz = ac.sampleRate; await ac.close();
  b.setAttribute("aria-pressed", "false"); b.disabled = true; yazi.textContent = T().sesYazi;
  try {
    const d = await (await fetch("/api/ses", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wavYap(parca, hz) })).json();
    if (!d.metin) throw new Error(d.hata ?? "bos");
    duyulanGoster(`“${d.metin}”`, `${T().duyulan} · ${T().sesKaynak}`);
    sesliSor(d.metin);
  } catch { duyulanGoster(T().sesHata); }
  finally { b.disabled = false; yazi.textContent = T().sesDugme; }
}
$("ses").onclick = sesDugme;
