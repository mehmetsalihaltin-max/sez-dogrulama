<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEZ · Uçuş güvenliği kanıt ekranı</title>
<meta name="description" content="Uçuş kararı verecek ekibe hangi olayın hangi kanıtla desteklendiğini gösteren ekran.">
<style>
@font-face{font-family:Newsreader;src:url(/v/newsreader-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Plex;src:url(/v/plex-l400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF}
@font-face{font-family:Plex;src:url(/v/plex-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0100-02AF}
@font-face{font-family:Plex;src:url(/v/plex-l600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF}
@font-face{font-family:Plex;src:url(/v/plex-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0100-02AF}
:root{
  --murekkep:#14323f;--kagit:#f3eee2;--sinyal:#c9391a;
  --cizgi:color-mix(in srgb,var(--murekkep) 22%,transparent);
  --soluk:color-mix(in srgb,var(--murekkep) 72%,var(--kagit));
  --kara:color-mix(in srgb,var(--murekkep) 13%,var(--kagit));
  --deniz:color-mix(in srgb,var(--murekkep) 4%,var(--kagit));
  --golge:0 8px 24px color-mix(in srgb,var(--murekkep) 14%,transparent);
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;--s8:64px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--kagit);color:var(--murekkep);font:400 16px/1.5 Plex,system-ui,sans-serif}
h1,h2,p,ol{margin:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--sinyal);outline-offset:2px}
.ekran{display:grid;grid-template-columns:minmax(0,7fr) minmax(360px,4fr);grid-template-rows:auto minmax(0,1fr);height:100vh}
.ust{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:end;padding:var(--s2) var(--s3);border-bottom:1px solid var(--murekkep)}
.damga{font:500 32px/1 Newsreader,serif;letter-spacing:.02em}
.damga small{display:block;font:400 12px/1.4 Plex,sans-serif;letter-spacing:.04em;color:var(--soluk);margin-top:4px}
form{display:flex;gap:var(--s2);align-items:end}
.kutu{flex:1;min-width:0}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--soluk)}
input{width:100%;border:0;border-bottom:1px solid var(--murekkep);background:none;color:inherit;font:500 24px/1.3 Newsreader,serif;padding:4px 0}
input:focus{outline:0;border-bottom:2px solid var(--sinyal);padding-bottom:3px}
button{font:600 14px/1 Plex,sans-serif;border:1px solid var(--murekkep);background:var(--murekkep);color:var(--kagit);padding:12px var(--s3);cursor:pointer;transition:background .15s,box-shadow .15s}
button:hover{background:var(--sinyal);border-color:var(--sinyal);box-shadow:var(--golge)}
button:disabled{opacity:.5;cursor:progress}
.harita{position:relative;background:var(--deniz);border-right:1px solid var(--murekkep);min-height:0;overflow:hidden}
svg{display:block;width:100%;height:100%}
.ag{fill:none;stroke:var(--cizgi);stroke-width:.5;stroke-dasharray:2 4}
.kure{fill:color-mix(in srgb,var(--murekkep) 7%,var(--kagit));stroke:var(--murekkep);stroke-width:1}
.kapali{fill:none;stroke:var(--sinyal);stroke-width:5;stroke-dasharray:8 6;stroke-linecap:butt}
.imad{font:600 14px Plex,sans-serif;fill:var(--murekkep);paint-order:stroke;stroke:var(--deniz);stroke-width:4px;pointer-events:none}
.kara{fill:var(--kara);stroke:color-mix(in srgb,var(--murekkep) 38%,var(--kagit));stroke-width:.5}
.gecilen{fill:color-mix(in srgb,var(--murekkep) 22%,var(--kagit))}
.olcek{stroke:var(--murekkep);stroke-width:2;fill:none}
.olcekad{font:600 12px Plex,sans-serif;fill:var(--murekkep);text-anchor:middle}
.yol{fill:none;stroke:var(--murekkep);stroke-width:2.5;stroke-linecap:round}
.ciz{animation:ciz 1.2s ease-out both}
@keyframes ciz{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.uc{fill:var(--kagit);stroke:var(--murekkep);stroke-width:2}
.ucad{font:600 16px Plex,sans-serif;fill:var(--murekkep);paint-order:stroke;stroke:var(--deniz);stroke-width:4px}
.imi circle{stroke:var(--kagit);stroke-width:2;transition:r .15s}
.imi text{font:600 12px Plex,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.imi{cursor:pointer}
.imi .dokun{fill:transparent;stroke:none;r:22px}
.bag{stroke:var(--murekkep);stroke-width:1}
.gosterge{position:absolute;right:var(--s2);top:var(--s2);display:grid;gap:4px;padding:var(--s1);background:var(--kagit);border:1px solid var(--cizgi);font-size:14px}
.gosterge[hidden]{display:none}
.gosterge span{display:flex;gap:var(--s1);align-items:center}
.gosterge i{width:12px;height:12px;border-radius:50%;border:2px solid var(--sinyal)}
.gosterge .d{background:var(--sinyal)}.gosterge .y{border-color:var(--soluk)}.gosterge .k{border-style:dashed;border-color:var(--murekkep)}
.elenen{font-size:12px;color:var(--soluk);margin-bottom:var(--s2)}
.elenen summary{font-weight:400}
.elenen li{margin:4px 0 0 var(--s2)}
.imi.etkin circle{r:17px}
.imi.genel circle{stroke-dasharray:4 3}
.imi.uzak{opacity:.55}
.koridor{fill:none;stroke:var(--sinyal);stroke-opacity:.24;stroke-linecap:round}
.s-teyitli circle{fill:var(--sinyal)}.s-teyitli text{fill:#fff}
.s-kismen circle,.s-tek-kaynak circle,.s-celiskili circle{fill:var(--kagit);stroke:var(--sinyal)}.s-kismen text,.s-tek-kaynak text,.s-celiskili text{fill:var(--sinyal)}
.s-kanit-yok circle{fill:var(--kagit);stroke:var(--soluk)}.s-kanit-yok text{fill:var(--soluk)}
.dipnot{font-size:14px;color:var(--soluk);margin:0 0 var(--s3);padding:var(--s1) var(--s2);border-left:2px solid var(--sinyal)}
.ray{overflow:auto;padding:var(--s3);min-height:0}
.acilis p{font:500 24px/1.3 Newsreader,serif;margin-bottom:var(--s3)}
.ornek{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--cizgi);color:inherit;padding:var(--s2) 0;font:400 16px/1.4 Plex,sans-serif}
.ornek:hover{background:none;border-color:var(--cizgi);box-shadow:none;color:var(--sinyal)}
.ornek b{display:block;font-size:12px;letter-spacing:.04em;color:var(--soluk)}
.gecmis{margin-top:var(--s6)}
.gecmis-baslik{font:600 12px/1.4 Plex,sans-serif!important;letter-spacing:.04em;color:var(--soluk);margin-bottom:var(--s1)!important}
.adimlar{list-style:none;font-size:14px}
.adimlar li{padding:var(--s1) 0;border-top:1px solid var(--cizgi)}
.adimlar li:last-child{font-weight:600}
.karar{font:500 32px/1.15 Newsreader,serif;margin-bottom:var(--s1)}
.alt{font-size:14px;color:var(--soluk);margin-bottom:var(--s3)}
.hata{color:var(--sinyal);font-weight:600;overflow-wrap:anywhere}
.bulgular{list-style:none}
.bulgu{display:grid;grid-template-columns:32px minmax(0,1fr);gap:0 var(--s1);padding:var(--s2) 0;border-top:1px solid var(--cizgi);transition:background .15s}
.bulgu.etkin{background:color-mix(in srgb,var(--sinyal) 7%,transparent)}
.no{font:600 14px/24px Plex,sans-serif;width:24px;height:24px;text-align:center;border-radius:50%;border:2px solid var(--sinyal);color:var(--sinyal)}
.b-teyitli .no{background:var(--sinyal);color:#fff}.b-kanit-yok .no{border-color:var(--soluk);color:var(--soluk)}
.seviye{font-size:12px;font-weight:600;letter-spacing:.04em}
.b-teyitli .seviye,.b-kismen .seviye,.b-tek-kaynak .seviye,.b-celiskili .seviye{color:var(--sinyal)}
.b-kanit-yok .seviye{color:var(--soluk)}
.iddia{font-size:16px;font-weight:600;margin:4px 0}
.meta{font-size:12px;color:var(--soluk)}
details{grid-column:2;margin-top:var(--s1);font-size:14px}
summary{cursor:pointer;font-weight:600}
summary:hover{color:var(--sinyal)}
.kanit{padding:var(--s1) 0 var(--s1) var(--s2);border-left:2px solid var(--cizgi);margin-top:var(--s1)}
.kanit q{display:block;font:500 16px/1.35 Newsreader,serif;quotes:none}
.kanit .tr{color:var(--soluk)}
.kaynak{font-size:12px}
.not{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--murekkep);font-size:12px;color:var(--soluk)}
.sahne-ac{background:none;color:var(--murekkep);white-space:nowrap}
.sahne-gorsel{position:absolute;inset:0;z-index:2;margin:0;background:var(--murekkep);color:var(--kagit)}
.sahne-gorsel[hidden]{display:none}
.sahne-gorsel{overflow:hidden}
.sahne-gorsel img{display:block;width:100%;height:100%;object-fit:cover}
.ust-sol{position:absolute;left:var(--s2);top:var(--s2);display:flex;align-items:center}
.yer{background:var(--murekkep);font-size:14px;font-weight:600;padding:4px var(--s1);line-height:16px}
.anahtar{position:absolute;right:var(--s2);top:var(--s2);display:grid;gap:4px;padding:var(--s1);background:var(--murekkep);font-size:12px}
.anahtar span{display:flex;gap:var(--s1);align-items:center}
.anahtar i{width:24px;height:8px;background:var(--r)}
.anahtar .serit{background:repeating-linear-gradient(90deg,var(--kagit) 0 6px,var(--murekkep) 6px 12px);outline:1px solid var(--kagit)}
.olcekcik{display:block;height:6px;margin-top:4px;border:1px solid var(--kagit);border-top:0}
.etiket{background:var(--sinyal);color:#fff;font-size:12px;font-weight:600;letter-spacing:.04em;padding:4px var(--s1)}
.kunye{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(2,auto) minmax(0,1fr);gap:var(--s3);align-items:end;padding:var(--s2);background:var(--murekkep);font-size:14px}
.kunye b{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:color-mix(in srgb,var(--kagit) 72%,var(--murekkep))}
.kunye small{font-size:12px;text-align:right;color:color-mix(in srgb,var(--kagit) 72%,var(--murekkep))}
.adim-sec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s1);list-style:none;margin:0 0 var(--s2);padding:0}
.adim-sec button{width:100%;padding:var(--s1);background:none;color:var(--murekkep);border-color:var(--cizgi);font-size:14px;text-align:left}
.adim-sec button:hover{background:none;color:var(--sinyal);border-color:var(--sinyal);box-shadow:none}
.adim-sec button[aria-current]{background:var(--murekkep);border-color:var(--murekkep);color:var(--kagit)}
.senaryo{font-size:14px;margin-bottom:var(--s2);padding:var(--s1) var(--s2);border-left:2px solid var(--sinyal)}
.senaryo b{color:var(--sinyal)}
.kart{margin:0}
.kart div.satir{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--s2);padding:var(--s1) 0;border-top:1px solid var(--cizgi)}
.kart dt{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--soluk);line-height:16px;padding-top:4px}
.kart .neden{border-top:2px solid var(--murekkep)}
.kart .neden dd{font:500 20px/1.35 Newsreader,serif}
.karar.yok{color:var(--sinyal)}
.kart .takip{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--sinyal)}
.kart dd{margin:0}
.durumlar{font-size:12px;font-weight:600;letter-spacing:.04em;margin-bottom:var(--s2)}
.durumlar.yok{color:var(--sinyal)}
.yontem{margin:var(--s1) 0 0;display:grid;gap:4px;font-size:12px;font-weight:400}
.yontem p{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:var(--s1);align-items:center}
.yontem i{display:block;height:8px;background:var(--kara)}
.yontem i span{display:block;height:100%;background:var(--murekkep)}
.yontem.yok i span{background:var(--sinyal)}
.yontem em{font-style:normal;text-align:right;font-weight:600}
.ucuslar{list-style:none;margin:var(--s1) 0 0;padding:0;font-size:14px;color:var(--soluk)}
@media (max-width:860px){
  .kunye{grid-template-columns:1fr 1fr;gap:var(--s1);padding:var(--s1) var(--s2)}.kunye small{grid-column:1/-1;text-align:left}
  .kart div.satir{grid-template-columns:1fr;gap:4px}
  .sahne-gorsel img{transform:scale(1.7)}
  .yer{font-size:12px}
  .anahtar{display:none}
  .ray:has(.kart){display:flex;flex-direction:column}
  .ray .senaryo{order:1;margin:var(--s2) 0 0}
  .ekran{display:block;height:auto}
  .ust{grid-template-columns:1fr;gap:var(--s1);padding:var(--s1) var(--s2)}
  .damga{font-size:24px}.damga small{display:none}
  .adim-sec button{font-size:12px;padding:var(--s1) 4px}
  form{gap:var(--s1);flex-wrap:wrap}
  .kutu{flex-basis:100%}
  form button{flex:1}
  input{font-size:18px}
  button{padding:12px var(--s2)}
  .harita{height:50vh;position:sticky;top:0;z-index:1;border-right:0;border-bottom:1px solid var(--murekkep)}
  .gosterge{display:none}
  button,summary{min-height:44px}
  summary{display:flex;align-items:center;gap:var(--s1)}
  .ray{padding:var(--s2)}
  .karar{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.ciz{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="ekran">
  <header class="ust">
    <h1 class="damga">SEZ<small>Uçuş güvenliği kanıt ekranı</small></h1>
    <form id="form">
      <div class="kutu">
        <label for="soru">Rota, yeni hat ya da ülke sorun</label>
        <input id="soru" autocomplete="off" required maxlength="300" placeholder="Los Angeles–Dubai rotasında bu hafta ne oldu?">
      </div>
      <button id="gonder" type="submit">Kanıtla</button>
      <button id="sahneAc" class="sahne-ac" type="button">Yeni kanıt sahnesi</button>
    </form>
  </header>
  <main class="harita" aria-label="Hat ve olay haritası">
    <svg id="svg" role="img" aria-label="Harita"></svg>
    <div class="gosterge" id="gosterge" hidden>
      <span data-g="teyitli"><i class="d"></i>Teyitli</span>
      <span data-g="zayif"><i></i>Kısmen, tek kaynak</span>
      <span data-g="kanit-yok"><i class="y"></i>Kanıt yok</span>
      <span data-g="genel"><i class="k"></i>Ülke geneli</span>
      <span data-g="kapali"><b style="color:var(--sinyal)">- -</b>Kapalı bildirilen hava sahası</span>
    </div>
    <figure class="sahne-gorsel" id="sahneGorsel" hidden>
      <img id="sahneResim" alt="">
      <div class="ust-sol"><span class="etiket">SENARYO</span><span class="yer" id="sahneYer"></span></div>
      <div class="anahtar" id="anahtar"></div>
      <figcaption class="kunye">
        <span><b>ÇEKİM ZAMANI</b><span id="cekim"></span></span>
        <span><b>İŞLEME ZAMANI</b><span id="isleme"></span></span>
        <small><span id="anahtarMetin"></span><span id="sahneAd"></span> · Copernicus Sentinel verisi (2024), işlenmiş</small>
      </figcaption>
    </figure>
  </main>
  <aside class="ray" id="ray" aria-live="polite"></aside>
</div>
<script src="/v/d3-array.js"></script>
<script src="/v/d3-geo.js"></script>
<script src="/v/topojson.js"></script>
<script>
const M = {
  seviye: { teyitli: "TEYİTLİ", kismen: "KISMEN", "tek-kaynak": "TEK KAYNAK", celiskili: "ÇELİŞKİLİ", "kanit-yok": "KANIT YOK" },
  tehlike: { savas: "Çatışma", hava: "Hava", saldiri: "Saldırı", deprem: "Deprem", sel: "Sel", grev: "Grev", yakit: "Yakıt", ariza: "Arıza", kul: "Volkan külü", dron: "Dron", gps: "GPS karıştırma", siber: "Siber", diger: "Diğer" },
  iliski: { koridorda: "HAT KORİDORU", bolgesel: "BÖLGESEL GELİŞME", "konum-genel": "ÜLKE GENELİ", "ulke-ici": "" },
  durum: {
    "hava-sahasi-kesisimi": (n, s) => `Bu hat ${ulkeAd(s.kesisim[0].ulke)} hava sahasından geçiyor. Hava sahası kapalı bildiriliyor.`,
    "koridorda-teyitli": (n) => `Hat koridorunda ${n} teyitli olay.`,
    "ulkede-teyitli": (n) => `Ülkede ${n} teyitli olay.`,
    "bolgesel-gelisme": () => "Koridorda teyitli olay yok.",
    "dogrulanmamis-isaret": () => "İşaret var, teyit yok.",
    "bulgu-yok": () => "Kapıdan geçen kanıt yok.",
  },
  durumAlt: {
    "hava-sahasi-kesisimi": (n, s) => s.kesisim[0].seviye === "teyitli" ? "Bu en kısa hat kullanılamaz, rotanın yeniden planlanması gerekir. Kararı ekip verir." : "Bilgi tam teyit edilmedi, ekip resmî kaynaktan doğrulamalı.",
    "koridorda-teyitli": "Olay doğrulandı. Uçuşa etkisini ekip değerlendirir.",
    "ulkede-teyitli": "Olay doğrulandı. Uçuşa etkisini ekip değerlendirir.",
    "bolgesel-gelisme": (n) => `Bölgede ${n} teyitli gelişme var, rotaya doğrudan bağı gösterilmedi.`,
    "dogrulanmamis-isaret": "Tek başına karar için yeterli değil.",
    "bulgu-yok": "Bu, güvenli demek olmaz; yalnız bu aralıkta kanıt bulunamadı.",
  },
  ornekler: [
    ["Mevcut rota", "Los Angeles–Dubai rotası bu hafta nasıl?"],
    ["Geçmiş olay: volkan külü", "Singapur–Bali rotası 20 Haziran 2025 için nasıl?"],
    ["Yeni hat", "Londra–Tokyo hattını açmak istiyoruz, ne bilmeliyiz?"],
    ["Ülke durumu", "Lübnan'da uçuş güvenliği durumu nedir?"],
  ],
  dil: { tr: "Türkçe", en: "İngilizce", ar: "Arapça", ru: "Rusça", fa: "Farsça", uk: "Ukraynaca", de: "Almanca", fr: "Fransızca", es: "İspanyolca", nl: "Felemenkçe", ja: "Japonca", zh: "Çince", ko: "Korece" },
};
const ulkeAd = (a) => new Intl.DisplayNames(["tr"], { type: "region" }).of(ULKE_KOD[a] ?? "ZZ")?.replace("Bilinmeyen Bölge", a) ?? a;
const ULKE_KOD = { Turkey: "TR", Syria: "SY", Iraq: "IQ", Iran: "IR", Lebanon: "LB", Israel: "IL", Jordan: "JO", Armenia: "AM", Azerbaijan: "AZ", Georgia: "GE", Russia: "RU", Ukraine: "UA", Yemen: "YE", Egypt: "EG", Sudan: "SD", Libya: "LY", Pakistan: "PK", Afghanistan: "AF", "Saudi Arabia": "SA", "United Arab Emirates": "AE", Qatar: "QA", Kuwait: "KW", Oman: "OM", Bahrain: "BH" };
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const el = (ad, sinif, metin) => { const e = document.createElement(ad); if (sinif) e.className = sinif; if (metin != null) e.textContent = metin; return e; };
const sv = (ad, oz = {}) => { const e = document.createElementNS(NS, ad); for (const k in oz) e.setAttribute(k, oz[k]); return e; };
const svg = $("svg"), ray = $("ray");
let dunya = [], kaynak, sonSonuc = null;

async function hazirla() {
  const t = await (await fetch("/v/dunya.json")).json();
  // Ayrintili sinir verisinde ters sarili halkalar var; d3 bunlari "butun dunya" sanar, duzeltilir.
  const duzelt = (p) => (d3.geoArea({ type: "Polygon", coordinates: p }) > 2 * Math.PI ? p.map((h) => [...h].reverse()) : p);
  dunya = topojson.feature(t, t.objects.countries).features.map((f) => ({
    ...f,
    geometry: f.geometry.type === "Polygon"
      ? { type: "Polygon", coordinates: duzelt(f.geometry.coordinates) }
      : { type: "MultiPolygon", coordinates: f.geometry.coordinates.map(duzelt) },
  }));
  ciz(null);
  acilis();
  // Ekran bos acilmasin: en son kayitli sorgu ayni yoldan yuklenir, para harcamaz.
  const liste = await (await fetch("/api/kayitlar")).json();
  const adres = new URLSearchParams(location.search);
  if (adres.has("sahne")) { sahneAc(+adres.get("sahne") || 0); return; }
  if (liste[0] && !adres.has("bos")) { $("soru").value = liste[0].soru; sorgula(liste[0].soru); }
}

function acilis() {
  ray.replaceChildren();
  const k = el("div", "acilis");
  k.append(el("p", null, "Hangi olay, hangi kanıtla?"));
  for (const [ust, s] of M.ornekler) {
    const b = el("button", "ornek"); b.type = "button";
    b.append(el("b", null, ust), document.createTextNode(s));
    b.onclick = () => { $("soru").value = s; sorgula(s); };
    k.append(b);
  }
  ray.append(k);
  fetch("/api/kayitlar").then((r) => r.json()).then((l) => {
    if (!l.length) return;
    const b = el("div", "gecmis");
    b.append(el("p", "gecmis-baslik", "Kayıtlı sorgular"));
    for (const g of l.slice(0, 5)) {
      const d = el("button", "ornek"); d.type = "button"; d.textContent = g.soru;
      d.onclick = () => { $("soru").value = g.soru; sorgula(g.soru); };
      b.append(d);
    }
    k.append(b);
  });
}

function ciz(s) {
  const { width: w, height: h } = svg.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.replaceChildren();
  const hedef = s?.hedef ?? {};
  const rota = hedef.rota;
  const noktalar = [...(rota ?? []), ...((s?.bulgular ?? []).filter((b) => b.konum).map((b) => b.konum.nokta))];
  const ulke = hedef.ulke && dunya.find((f) => f.properties.name === hedef.ulke);
  const nesne = ulke ?? (noktalar.length ? { type: "MultiPoint", coordinates: noktalar } : { type: "Sphere" });
  const merkez = d3.geoCentroid(nesne.type === "Sphere" ? { type: "Point", coordinates: [30, 25] } : nesne);
  // Uzun hat kure uzerinde gosterilir; ortasi ekranin merkezinden kaydirilinca yay kavisli gorunur.
  const kure = rota && d3.geoLength({ type: "LineString", coordinates: rota }) * 6371 > 6000;
  const orta = rota && d3.geoCentroid({ type: "LineString", coordinates: rota });
  const izdusum = kure
    ? d3.geoOrthographic().rotate([-orta[0], -(orta[1] + (orta[1] > 0 ? -24 : 24))]).fitExtent([[24, 24], [w - 24, h - 24]], { type: "Sphere" })
    : (nesne.type === "Sphere" ? d3.geoNaturalEarth1() : d3.geoAzimuthalEquidistant().rotate([-merkez[0], -merkez[1]]).clipAngle(90)).fitExtent([[64, 56], [w - 64, h - 56]], nesne);
  const yol = d3.geoPath(izdusum);
  if (kure) svg.append(sv("path", { class: "kure", d: yol({ type: "Sphere" }) }));
  svg.append(sv("path", { class: "ag", d: yol(d3.geoGraticule10()) }));
  const gecilen = new Set(hedef.ulkeler ?? (hedef.ulke ? [hedef.ulke] : []));
  for (const f of dunya) svg.append(sv("path", { class: "kara" + (gecilen.has(f.properties.name) ? " gecilen" : ""), d: yol(f) }));
  if (rota) {
    const km1 = 1 / 6371 * 180 / Math.PI; // bir kilometrenin derece karsiligi
    const [a, b] = [izdusum(merkez), izdusum([merkez[0], merkez[1] + km1 * 100])];
    const pikselKm = Math.hypot(a[0] - b[0], a[1] - b[1]) / 100;
    svg.append(sv("path", { class: "koridor", d: yol({ type: "LineString", coordinates: rota }), "stroke-width": Math.max(8, 2 * (s.koridorKm ?? 150) * pikselKm) }));
    svg.append(sv("path", { class: "yol ciz", d: yol({ type: "LineString", coordinates: rota }), pathLength: 1, "stroke-dasharray": 1 }));
    for (const u of [hedef.kalkis, hedef.varis]) {
      const [x, y] = izdusum(u.nokta);
      svg.append(sv("circle", { class: "uc", cx: x, cy: y, r: 6 }));
      const t = sv("text", { class: "ucad", x: x + 10, y: y - 10 }); t.textContent = u.iata; svg.append(t);
    }
  }
  $("gosterge").hidden = !s;
  for (const k of s?.kesisim ?? []) for (const p of k.parcalar) svg.append(sv("path", { class: "kapali", d: yol({ type: "LineString", coordinates: p }) }));
  const gorunen = new Set((s?.bulgular ?? []).flatMap((b) => [b.seviye === "teyitli" ? "teyitli" : b.seviye === "kanit-yok" ? "kanit-yok" : "zayif", b.konum?.tur === "ulke" ? "genel" : ""]));
  if (s?.kesisim?.length) gorunen.add("kapali");
  document.querySelectorAll("[data-g]").forEach((e) => { e.hidden = !gorunen.has(e.dataset.g); });
  if (nesne.type !== "Sphere" && !kure) {
    const km = 1 / 6371 * 180 / Math.PI;
    const [a, b] = [izdusum(merkez), izdusum([merkez[0], merkez[1] + km * 100])];
    const pikselKm = Math.hypot(a[0] - b[0], a[1] - b[1]) / 100;
    const uzunluk = [100, 200, 500, 1000, 2000, 5000].find((u) => u * pikselKm >= 64) ?? 5000;
    const x2 = w - 24, x1 = x2 - uzunluk * pikselKm, yy = h - 24;
    svg.append(sv("path", { class: "olcek", d: `M${x1} ${yy - 4}V${yy}H${x2}V${yy - 4}` }));
    const t = sv("text", { class: "olcekad", x: (x1 + x2) / 2, y: yy - 8 }); t.textContent = `${uzunluk} km`; svg.append(t);
  }
  const yerler = [];
  (s?.bulgular ?? []).forEach((b, i) => {
    if (!b.konum) return;
    const [x0, y0] = izdusum(b.konum.nokta);
    // Yakin isaretler ayni noktanin cevresine acilir, ince cizgi gercek yere baglar.
    const kume = yerler.filter((p) => Math.hypot(p.x0 - x0, p.y0 - y0) < 30).length;
    const aci = -Math.PI / 2 + kume * (Math.PI / 3);
    const [x, y] = kume ? [x0 + 34 * Math.cos(aci), y0 + 34 * Math.sin(aci)] : [x0, y0];
    yerler.push({ x0, y0 });
    if (kume) svg.append(sv("line", { class: "bag", x1: x0, y1: y0, x2: x, y2: y }));
    const genel = b.konum.tur === "ulke" && b.iliski !== "koridorda";
    const g = sv("g", { class: `imi s-${b.seviye}${genel ? " genel" : ""}${b.iliski === "bolgesel" ? " uzak" : ""}`, "data-no": i, tabindex: 0, role: "button", "aria-label": `${i + 1}. bulgu` });
    g.append(sv("circle", { class: "dokun", cx: x, cy: y }));
    g.append(sv("circle", { cx: x, cy: y, r: 14 }));
    const t = sv("text", { x, y }); t.textContent = i + 1; g.append(t);
    if (b.seviye !== "kanit-yok") {
      const sagda = x < w - 180;
      const ad = sv("text", { class: "imad", x: x + (sagda ? 20 : -20), y: y + 5, "text-anchor": sagda ? "start" : "end" });
      ad.textContent = `${b.konum.tur === "ulke" ? ulkeAd(b.konum.ad) : b.konum.ad}, ${(M.tehlike[b.tehlike] ?? M.tehlike.diger).toLocaleLowerCase("tr")}`;
      g.append(ad);
    }
    g.onmouseenter = () => vurgula(i);
    g.onclick = () => { vurgula(i); document.getElementById(`bulgu-${i}`)?.scrollIntoView({ behavior: "smooth", block: "nearest" }); };
    svg.append(g);
  });
}

function vurgula(i) {
  document.querySelectorAll(".imi,.bulgu").forEach((e) => e.classList.toggle("etkin", +e.dataset.no === i));
}

function kanitKart(k) {
  const d = el("div", "kanit");
  const q = el("q", null, k.alinti); q.dir = "auto"; if (k.dil) q.lang = k.dil;
  d.append(q);
  if (k.ceviri && k.dil !== "tr") d.append(el("p", "tr", k.ceviri));
  const p = el("p", "kaynak");
  const a = el("a", null, k.yayinci);
  if (/^https?:\/\//.test(k.url)) { a.href = k.url; a.target = "_blank"; a.rel = "noopener noreferrer"; }
  p.append(a, document.createTextNode(` · ${k.tarih ?? ""} · ${M.dil[k.dil] ?? ""}`));
  d.append(p);
  return d;
}

function goster(s) {
  sonSonuc = s;
  ciz(s);
  ray.replaceChildren();
  const teyitli = s.bulgular.filter((b) => b.seviye === "teyitli");
  const kor = teyitli.filter((b) => b.iliski === "koridorda" || b.iliski === "ulke-ici").length;
  ray.append(el("h2", "karar", M.durum[s.durum](kor, s)));
  const alt = M.durumAlt[s.durum];
  ray.append(el("p", "alt", `${typeof alt === "function" ? alt(teyitli.length, s) : alt} Taranan aralık: ${s.pencere.ilk} / ${s.pencere.son}.`));
  if (s.hedef.rota) ray.append(el("p", "dipnot", `${s.hedef.hatKaynagi ? `Hat, ${s.hedef.hatKaynagi.ucus} uçuşunun ${s.hedef.hatKaynagi.tarih} tarihli gerçek izinden elle alınmış yaklaşık çizimdir.` : "Bu rota için kayıtlı uçuş izi yok; çizgi en kısa teorik hattır, gerçek uçuş yolu değildir."} Bant: hattın iki yanında ${s.koridorKm ?? 150} km.`));
  if (s.elenenler?.length) {
    const d = el("details", "elenen");
    d.append(el("summary", null, `${s.elenenler.length} olay uçuşla ilgisiz bulunup elendi`));
    const l = el("ul");
    for (const e of s.elenenler) l.append(el("li", null, e));
    d.append(l);
    ray.append(d);
  }
  const ol = el("ol", "bulgular");
  s.bulgular.forEach((b, i) => {
    const li = el("li", `bulgu b-${b.seviye}`); li.id = `bulgu-${i}`; li.dataset.no = i;
    li.onmouseenter = () => vurgula(i);
    li.append(el("span", "no", i + 1));
    const g = el("div");
    g.append(el("div", "seviye", [M.seviye[b.seviye], b.suren ? "SÜREN KISIT" : "", M.iliski[b.iliski], M.tehlike[b.tehlike] ?? M.tehlike.diger].filter(Boolean).join(" · ")));
    g.append(el("p", "iddia", b.iddia));
    const yayinci = `${b.bagimsiz} ayrı haber`;
    const dil = b.diller.map((d) => M.dil[d] ?? d).join(", ");
    g.append(el("p", "meta", [b.olayTarihi, yayinci, dil, b.rotayaKm != null ? `rotaya ${b.rotayaKm} km` : b.konum?.tur === "ulke" ? `${ulkeAd(b.konum.ad)} geneli` : ""].filter(Boolean).join(" · ")));
    li.append(g);
    if (b.kanitlar.length || b.celiski.length) {
      const dt = el("details");
      dt.open = i === 0;
      dt.append(el("summary", null, `Haber kanıtı (${b.kanitlar.length + b.celiski.length})`));
      for (const k of [...b.kanitlar, ...b.celiski]) dt.append(kanitKart(k));
      li.append(dt);
    }
    ol.append(li);
  });
  ray.append(ol);
  ray.append(el("p", "not", "SEZ kanıtı gösterir, uçuş kararını operasyon ekibi verir. Seviyeyi model yazmaz; kod ayrı haber sayısından hesaplar. Kanıtlar haber kaynaklarından gelir, resmî kayıt yerine geçmez. Olayın doğrulanması, uçuşa etkisinin kanıtlandığı anlamına gelmez."));
}

let sahne = null, sahneAdim = 0;
const sahneKapat = () => { $("sahneGorsel").hidden = true; };

async function sahneAc(i = 0) {
  sahne ??= await (await fetch("/api/sahne")).json();
  kaynak?.close();
  $("gonder").disabled = false;
  $("sahneGorsel").hidden = false;
  sahneCiz(i);
}

function sahneAnahtar(a) {
  const z = matchMedia("(max-width:860px)").matches ? 1.7 : 1; // mobilde pist yakinlastirilir
  const { width: w, height: h } = $("sahneGorsel").getBoundingClientRect();
  const satirlar = a.sonucYok ? [["serit", "Pist: yöntemler uyuşmuyor, oran yok"]] : [["#c9391a", "İki yöntem de su diyor"], ["#f3eee2", "İki yöntem birlikte su demiyor"]];
  const k = $("anahtar"); k.replaceChildren();
  for (const [r, m] of satirlar) {
    const s = el("span"), c = el("i", r === "serit" ? "serit" : "");
    if (r !== "serit") c.style.setProperty("--r", r);
    s.append(c, document.createTextNode(m)); k.append(s);
  }
  const o = el("span", "olcekcik"); o.style.width = `${(1000 * Math.max(w, h) * z) / sahne.kareMetre}px`;
  k.append(o, el("small", null, "1 km · Kuzey yukarıda"));
  $("anahtarMetin").textContent = z > 1 ? `${satirlar.map((x) => x[1]).join(" · ")} · ` : "";
}

function sahneCiz(i) {
  const a = sahne.adimlar[i];
  $("sahneResim").src = a.gorsel;
  $("sahneResim").alt = `${sahne.meydan} pisti, ${a.gun} uydu görüntüsü. ${a.baslik}`;
  $("cekim").textContent = a.cekim;
  $("isleme").textContent = a.isleme;
  $("sahneAd").textContent = a.sahne;
  $("sahneYer").textContent = sahne.meydan;
  sahneAdim = i;
  sahneAnahtar(a);
  ray.replaceChildren();
  const se = el("p", "senaryo");
  se.append(el("b", null, "SENARYO. "), document.createTextNode(`Pist ölçümleri gerçek Sentinel-2 görüntülerinden gelir. Üç uçuş, yedek meydan planı ve %${sahne.senaryoEsik} sınırı kurgusaldır.`));
  ray.append(se);
  const sec = el("ol", "adim-sec");
  sahne.adimlar.forEach((x, n) => {
    const li = el("li"), b = el("button", null, x.gun); b.type = "button";
    if (n === i) b.setAttribute("aria-current", "step");
    b.onclick = () => sahneCiz(n);
    li.append(b); sec.append(li);
  });
  ray.append(sec);
  ray.append(el("h2", "karar" + (a.sonucYok ? " yok" : ""), a.baslik));
  ray.append(el("p", "durumlar" + (a.sonucYok ? " yok" : ""), `KANIT DURUMU: ${a.kanit}`));
  const k = el("dl", "kart");
  const satir = (ad, metin, sinif = "") => { const d = el("div", `satir ${sinif}`); d.append(el("dt", null, ad)); const dd = el("dd", null, metin); d.append(dd); k.append(d); return dd; };
  satir("ÖNCE", a.once);
  const sim = satir("ŞİMDİ", a.simdi);
  const ol = el("div", "yontem" + (a.sonucYok ? " yok" : ""));
  for (const [ad, v] of [["NDWI", a.olcum.ndwi], ["SCL", a.olcum.scl]]) {
    const p = el("p"), c = el("i"), d = el("span"); d.style.width = `${v}%`; c.append(d);
    p.append(el("span", null, ad), c, el("em", null, `%${v.toLocaleString("tr-TR")}`)); ol.append(p);
  }
  sim.append(ol);
  satir("NEDEN", a.neden, "neden");
  const et = satir("OPERASYONEL ETKİ", a.etki);
  const u = el("ul", "ucuslar");
  for (const f of sahne.ucuslar) u.append(el("li", null, `${f.kod} ${f.hat}`));
  et.append(u);
  satir("BEKLEYEN", a.bekleyen).prepend(el("span", "takip", a.takip));
  ray.append(k);
  ray.append(el("p", "not", `NDWI: görüntünün yeşil ve yakın kızılötesi bantlarından hesaplanan su göstergesi. SCL: Avrupa Uzay Ajansı sahne sınıflandırması. İki yöntem ${a.olcum.sinir} puandan çok ayrılırsa SEZ oran yazmaz. Uçuş kararını operasyon ekibi verir.`));
}

function sorgula(s) {
  kaynak?.close();
  sahneKapat();
  $("gonder").disabled = true;
  ray.replaceChildren();
  const liste = el("ol", "adimlar"); ray.append(liste);
  const bitir = () => { kaynak.close(); $("gonder").disabled = false; };
  kaynak = new EventSource(`/api/sor?s=${encodeURIComponent(s)}`);
  kaynak.onmessage = (o) => {
    const d = JSON.parse(o.data);
    if (d.tip === "ilerleme") liste.append(el("li", null, d.metin));
    if (d.tip === "sonuc") { bitir(); goster(d.sonuc); }
    if (d.tip === "hata") { bitir(); ray.replaceChildren(el("p", "hata", d.metin)); }
  };
  kaynak.onerror = () => { bitir(); ray.replaceChildren(el("p", "hata", "Sunucuyla bağlantı kesildi.")); };
}

$("sahneAc").onclick = () => sahneAc();
$("form").onsubmit = (o) => { o.preventDefault(); sorgula($("soru").value.trim()); };
let son; addEventListener("resize", () => { clearTimeout(son); son = setTimeout(() => { ciz(sonSonuc); if (!$("sahneGorsel").hidden) sahneAnahtar(sahne.adimlar[sahneAdim]); }, 150); });
hazirla();
</script>
</body>
</html>
